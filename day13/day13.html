<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .parent{
         border:2px solid blue;
         height:90vh;
         display:grid;
            grid-template-columns: 50px 60px 70px 80px ;
            grid-template-columns:20% 30% 40%;
            grid-template-rows: 50px 60px 70px 80px;
            gap:20px;
            justify-content:center;
            align-content:center;
            grid-template-rows:100px 200px 300px;
        
       }
       .child{
         background:lightseagreen;
         border:2px solid black;
         padding:6px;
         
       }
       .container{
        height:80vh;
        display:grid;
        grid-template-columns: 1fr 1fr 1fr 1fr ;
       }
       .b1{
        grid-column:1/2;
        grid-row:1/4;
        background:green;
       }
       .b2{
        grid-column:2/4;
        grid-row:1/2;
    
       }
       .b8{
        grid-column:4/5;
        grid-row:2/4;
       }
       
    </style>
</head>
<body>
    <div class="parent">
         <div class="child">child1</div>
         <div class="child">child2</div>
         <div class="child">child3</div>
         <div class="child">child4</div>
         <div class="child">child5</div>
         <div class="child">child6</div>
         <div class="child">child7</div>
         <div class="child">child8</div>
         <div class="child">child9</div>
    </div>
    

    <div class="container">
         <div class="child b1">box 1</div>
         <div class="child b2">box 2</div>
         <div class="child b3">box 3</div>
         <div class="child b4">box 4</div>
         <div class="child b5">box 5</div>
         <div class="child b6">box 6</div>
         <div class="child b7">box 7</div>
         <div class="child b8">box 8</div>
         <div class="child b9">box 9</div>
    </div>
</body>
</html>
